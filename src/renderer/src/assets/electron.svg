<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆 -->
  <!-- <circle cx="64" cy="64" r="60" fill="#2F3242" /> -->
  <rect x="12" y="12" width="104" height="104" rx="16" fill="#EFEFEF" stroke="#2F3242" stroke-width="0" />

  <!-- 日志文档形状 -->
  <rect x="32" y="28" width="64" height="72" rx="4" fill="#4a4d5c" stroke="#A2ECFB" stroke-width="2" />

  <!-- 文档折角效果 -->
  <path d="M84 28 L96 40 L84 40 Z" fill="#A2ECFB" />
  <!-- <line x1="84" y1="28" x2="96" y2="40" stroke="#A2ECFB" stroke-width="2" /> -->

  <!-- 文本行 -->
  <line x1="40" y1="40" x2="80" y2="40" stroke="#A2ECFB" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="50" x2="72" y2="50" stroke="#A2ECFB" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="60" x2="84" y2="60" stroke="#A2ECFB" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="70" x2="64" y2="70" stroke="#A2ECFB" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="80" x2="58" y2="80" stroke="#A2ECFB" stroke-width="2" stroke-linecap="round" />

  <!-- 放大镜表示搜索功能 -->
  <circle cx="80" cy="84" r="8" fill="none" stroke="#A2ECFB" stroke-width="2" />
  <line x1="86" y1="90" x2="92" y2="96" stroke="#A2ECFB" stroke-width="2" stroke-linecap="round" />
</svg>